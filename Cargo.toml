[package]
name = "fast_brass"
version = "0.1.0"
edition = "2021"
default-run = "fast_brass"

[lib]
name = "fast_brass"
crate-type = ["rlib", "cdylib"]

[features]
default = []
cloud-ui = []
python-bindings = ["dep:pyo3", "pyo3/abi3-py38", "pyo3/auto-initialize"]
python-extension = ["python-bindings", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.24.0", optional = true }
fixedbitset = "0.5.7"
once_cell = "*"
rand = "*"
num_enum = "0.7"
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "decompression-gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
proptest = "1.0"
